# ── Research I reproduction overlay (E1: "reproduce the old null") ────────────
# Usage:  amcd all -c configs/base.yaml -c configs/research_i.yaml
#
# Pins docs/research_I_paper.md Figure 5 (dataset configuration, l.488-503) and
# Figure 6 (split configuration, l.507-514). base.yaml is the v3 extension
# baseline and deliberately differs; THIS file is the one that claims RI
# faithfulness, so every RI-specified value is restated here even where base.yaml
# already agrees — a reproduction config that silently inherits half its values
# is not auditable (ledger RD-26).
#
# ── Figure 5 / 6 coverage ─────────────────────────────────────────────────────
# PINNED HERE:      base seed 42 · 48 kHz · 3.0 s · order 3 · float32 · ray pair
#                   5,000/200,000 · retained-path top-k 5,000 · shoebox and
#                   corridor geometry ranges · per-axis margins · heights
#                   1.2-1.8 m · source-receiver separation 1.0-10.0 m · split
#                   counts 500/60/60/40/30/30 · per-split seeds 1001-1006
#                   the four QC thresholds — see the QC block below, which pins
#                   all of them (RD-18 closed the two keys that did not exist)
#
# ── SIX DELIBERATE DEVIATIONS — this config is NOT a verbatim RI clone ────────
# Each is arbitrated and tracked; the E1 report must disclose them per split.
#
# 1. (RD-27) RI's test_geometry_shift is DUAL-axis — corridor AND
#    `near_wall+far_pair` (Figure 6 l.514) — which breaks v3 invariant #10
#    (a shift split perturbs exactly ONE axis). We keep invariant #10 and hold
#    placement at the id regime. E1 is a methodological reproduction, not a
#    bit-exact one (pygsound exposes no RNG seed at all — RD-23), and cloning a
#    confounded split would make v3's own robustness claim uninterpretable.
#    ⇒ v3's test_geometry_shift is NOT comparable to RI's 0.61 baseline rel-L2.
#
# 2. (RD-28/AC-20) RI's material shift targets ceiling_absorptive AND
#    asymmetric_walls. `asymmetric_walls` needs per-surface absorption; SceneSpec
#    carries one scalar, so only ceiling_absorptive is applied — and that scalar
#    is applied to ALL SIX SURFACES, not to a ceiling.
#    ⇒ the material shift here is DIFFERENT IN KIND and LARGER IN MAGNITUDE than
#      RI's — not weaker. Measured, not argued: α ∈ [0.85, 0.98] on six surfaces
#      gives Sabine T60 0.117 / 0.161 / 0.209 s for 6x5x3, 10x8x3.5 and
#      14x10x4.5 m rooms, whereas an area-weighted ceiling-only reading of RI's
#      "ceiling_absorptive" gives 0.42 / 0.51 / 0.65 s (mean α 0.27-0.31) — 3-4x
#      stronger. On the realized RI dataset, test_material_shift has Sabine T60
#      median 0.151 s and Eyring 0.059 s against train's 0.327 / 0.257 s.
#      The split is NEAR-ANECHOIC, not "a room with a more absorptive ceiling".
#      Dropping asymmetric_walls weakens the shift; the scalar-on-all-surfaces
#      implementation overshoots it by far more. The split is not comparable to
#      RI's, and the E1 report must state the direction as measured here.
#    ⇒ Consequences that follow (AC-21, AC-26/AC-27, RD-46): the diffuse-field
#      model this characterization relies on has failed for 100 % of this split
#      (Sabine/Eyring ratio median 2.51; critical distance exceeds the largest
#      room dimension in 23 % of scenes). The split is retained for the PAIRED
#      comparison — a near-anechoic room is still a room the model must denoise —
#      and its absolutes are DIAGNOSTIC ONLY.
#
#      That diagnostic-only status now rests on THIS DISCLOSURE, not on
#      suppression, and the change is deliberate. The old wording said absolutes
#      below `metric_min_measurable_t60_s` (0.05 s) were "reported unscored"; this
#      split's Eyring median T60 is 0.059 s, so that threshold suppressed the
#      MAJORITY of its EDT realizations and biased the surviving mean +31.2 %
#      (measured, 200 realizations at true T60 = 0.06 s). Censoring an estimator
#      on its own value is not a disclosure, it is a distortion.
#
#      UPDATED (AC-38, cycle 4) — the reversal of RD-46's original decision is now
#      COMPLETE, and stated here rather than left to be inferred from a diff.
#      Cycle 3 replaced the 0.05 s scalar with the filter's own resolvable decay
#      (~0.010-0.020 s here), which these decays clear, so suppression stopped
#      biting for this split. Cycle 4 removes it as a MECHANISM for the physical
#      legs entirely: a low/high value below the floor is REPORTED and flagged,
#      never dropped, because the same censoring argument holds at any threshold
#      (measured: +13.4 % survivor bias at true T60 = 0.02 s against +8.3 %
#      disclosed). RD-46's decision was to SUPPRESS this split's absolutes; that
#      decision no longer stands anywhere in the metric path, and this split's
#      absolutes are now reported for every scene.
#
#      They are LABELLED instead, on two independent counts: how many scenes fall
#      below `metric_edt_variance_limited_s` (the EDT estimator carries 24-31 % sd
#      there), and how many bands were resolvability-limited but reported anyway.
#      Read this split's absolutes as high-variance diagnostics, never as physical
#      values. NOTE: the second count reaches `metrics.parquet` only — carrying it
#      into `ci_table.csv` and summary.txt's Caveats column is lane P's half of
#      AC-38 and is NOT done, so at the time of writing the reported table does not
#      show it.
#
# 3. (RD-29) RI's placement regimes carry `+mid_pair` / `+far_pair` pairing
#    sub-regimes whose distance sub-ranges the paper NEVER states numerically —
#    only the global 1.0-10.0 m (Figure 5 l.502). Rather than invent them, all
#    regimes get the global range. RI's *id* regime is `interior_random+mid_pair`,
#    so this changes the source-receiver distance distribution of FIVE OF SIX
#    splits, and distance drives DRR → C50/D50/EDT.
#    ⇒ the realized per-split distance distribution is recorded in
#      scenes/placement_report.json so the E1 report can state what stood in.
#
# 4. (AC-22) RI's declared geometry x absorption support reaches Sabine T60 4.09 s
#    while its Figure 5 `ir_duration` is 3.0 s, so THE RECORD DOES NOT COVER THE
#    DECLARED SUPPORT. Structural, not a research choice — lengthening the record
#    would stop this being a reproduction. Quantified at the `scenes:` block below.
#
# 5. Values RI never quantifies are inherited from base.yaml and flagged inline
#    below: near_corner's corner_frac, and the absorption ranges of the `mixed`
#    and `ceiling_absorptive` material regimes.
#
# 6. (AC-186, user decision 2026-08-13) `diffuse_depth` is pinned to 200, where RI
#    inherited pygsound's unstated default of 100. It is the reflection-order
#    bound, and measurement showed it is what actually sets the record length —
#    at 100 it truncates 5.56 % of RI's own declared population below the decay
#    range ISO 3382-1 requires for T30. RI never chose 100; it never named the
#    parameter at all. Pinned at the simulator block below, with the cost.
#    ⇒ E1's records are LONGER than RI's were. Absolutes over the reverberant
#      tail are therefore measurable here and were partly truncation-biased in
#      RI; the PAIRED improvement is unaffected either way, because both legs of
#      a comparison share the record.

run_id: E1

# ── Figure 5: base seed ───────────────────────────────────────────────────────
seeds:
  master: 42

# ── Figure 5: audio ───────────────────────────────────────────────────────────
# Stored data type float32 is structural (renders are written as float32), not a
# config key.
sample_rate: 48000
ir_duration: 3.0
ambisonics_order: 3

# ── Figure 5: quality-control thresholds — all four, as RI states them ────────
# base.yaml declares its own stricter energy floor for its own reasons; this config
# claims RI faithfulness, so it pins RI's (paper §B.4 and Figure 5). The onset
# tolerance and the file-size bound already agree with base.yaml and are restated
# here rather than inherited, because a reader checking this file against Figure 5
# must find all four in it (RD-18).
onset_mismatch_tolerance_ms: 2.0
# RI's floor is a LINEAR total energy of 1e-10, which is -100 dB re 1.0. base.yaml's
# -60 dB re 1.0 is ~40 dB stricter and would exclude scenes RI admitted, so
# reproducing the old null requires RI's number, not the better one.
min_energy_db: -100.0
min_energy_reference: 1.0
max_path_file_mb: 128.0
require_non_empty_path_file: true

# ── Figure 5: ray budgets — FROZEN for E1 ─────────────────────────────────────
# Do not change these to explore cost. The Step 6 ray-budget probe informs the
# EXTENSION's sweep ladder only; the reference leg defines every downstream
# number, so lowering it would silently redefine the result being reproduced.
low_ray_budget: 5000
high_ray_budget: 200000

# ── Figure 5: retained-path policy, and the one parameter RI never stated ─────
simulator:
  name: gsound_sir
  params:
    path_retention:
      mode: top_k
      value: 5000
    # PINNED HERE BECAUSE RESEARCH I NEVER STATED IT (deviation 6, user decision
    # 2026-08-13). `diffuse_depth` is absent from Figure 5 and from RI's prose, so
    # RI ran whatever pygsound defaults to — 100 — without choosing it. That
    # inherited default is not a neutral choice: it is a TIME bound on the decay
    # (measured, `experiments/support_law/`: realized record scales as
    # depth**0.688 and does not depend on T60 at all), and at 100 it truncates
    # 5.56 % of RI's declared population below the 45 dB ISO 3382-1 needs for a
    # T30 fit — enough that `gen-scenes` refused the config outright.
    #
    # 200 is pinned rather than 100 so the value is a recorded decision instead of
    # an unrecorded default, and so E1's reverberant tail is measurable: censoring
    # falls to ~0.2 %. It costs 2.5x render wall-clock (27.9 s -> 69.1 s per
    # high-ray scene on the largest declared room, measured), i.e. roughly 6 -> 14
    # hours for the full 720-scene dataset.
    #
    # Going higher buys nothing: pygsound compiles `maxIRLength = 3.0 s` and does
    # not expose it, and at depth 200 the largest rooms already reach that ceiling
    # (native 146048 samples = 3.043 s, measured). RI's own `ir_duration` is 3.0 s,
    # so the record is full.
    diffuse_depth: 200

scenes:
  # Count mode: each id-pool split declares its own count and seed below, so
  # there is no pool to divide. Explicitly null rather than absent — a YAML
  # overlay cannot DELETE base.yaml's `n_id: 500` (RD-32).
  n_id: null

  id_regime:
    geometry: shoebox
    placement: interior_random
    material: mixed

  # Figure 5: minimum wall margin 0.5 m, floor 0.5 m, ceiling 0.3 m.
  # NOTE: the ceiling margin never actually binds here — every RI room is at
  # least 2.4 m tall, so the admissible height band [0.5, h-0.3] always contains
  # the declared 1.2-1.8 m range. Pinned for faithfulness, not because it acts.
  margins:
    wall: 0.5
    floor: 0.5
    ceiling: 0.3

  # Bound on distance-constraint rejection sampling. It never binds in shoeboxes
  # (see below) but does real work in long corridors.
  max_placement_attempts: 1000

  # ── Deviation 4 (see header): the record does not cover the declared support ─
  # RI's declared geometry x absorption support reaches Sabine T60 4.09 s (the
  # 14 x 10 x 4.5 m shoebox at alpha = 0.05) while `ir_duration` is 3.0 s.
  #
  # This is STRUCTURAL, not a research choice: 3.0 s is an RI-pinned Figure 5
  # value and lengthening it would stop this config being a reproduction. It is
  # therefore declared and quantified rather than fixed. base.yaml, which is free
  # to choose, went the other way — ir_duration 4.25 s and a tolerance of 0.0.
  #
  # MEASURED on this config: 4 of 720 scenes (0.56 %) exceed 3.0 s, worst ~3.56 s
  # (~-2 % T30 bias by the project's own probe — inside the 5 % T30 JND). The
  # tolerance below is set just above that realized rate, so it discloses the
  # known deviation without licensing a materially worse one: at 720 scenes it
  # permits 7, and the run fails loudly if the ranges or the record ever move
  # enough to exceed that.
  # 0.05 against a MEASURED 3.8% (27/720). Was 0.01, set when the gate compared
  # Sabine T60 against `ir_duration`; it now compares against the record GSound-SIR
  # actually produces, which is much shorter (AC-175/AC-184). RI's 3.0 s record was
  # always known not to cover its 4.09 s corner — the realized shortfall is simply
  # larger than the old instrument could see. Accepted as a renderer limitation per
  # the user decision at design_spec 11.2; the affected scenes return T30 unscored
  # with a reason rather than a truncation-biased number.
  max_frac_below_iso_t30_decay_range: 0.05

  # Figure 5: shoebox L 4.0-14.0 / W 3.0-10.0 / H 2.4-4.5 m;
  #           corridor L 8.0-24.0 / W 1.8-4.0 / H 2.4-4.0 m.
  geometry_families:
    shoebox:  { dims: [[4.0, 14.0], [3.0, 10.0], [2.4, 4.5]], characterization: sabine }
    corridor: { dims: [[8.0, 24.0], [1.8, 4.0], [2.4, 4.0]], characterization: sabine }

  placement_regimes:
    # Figure 5: source/receiver height 1.2-1.8 m; separation 1.0-10.0 m.
    # The separation constraint binds ASYMMETRICALLY, which matters when reading
    # the acceptance rates in scenes/placement_report.json: in the smallest RI
    # shoebox (4 x 3 m, heights 1.2-1.8, 0.5 m walls) the greatest achievable
    # separation is only ~3.7 m, so the 10 m ceiling is inert and the constraint
    # acts purely as a 1.0 m minimum; in a 24 m corridor the 10 m ceiling is what
    # does the rejecting. See deviation 3 above.
    #
    # THE 1.0 m MINIMUM CARRIES base.yaml's AC-30/AC-50 CAVEAT, and the 10.0 m
    # ceiling adds one of its own. ISO 3382-1 5.3's d_min = 2*sqrt(alpha*S/(c*K))
    # over the declared geometry x material corners is [0.412, 5.712] m by Sabine
    # and [0.417, 11.413] m by Eyring — so the EYRING CORNER EXCEEDS THIS ENTIRE
    # RANGE, and no separation this config can draw satisfies the standard's
    # criterion at that corner. Nominal alpha as configured; pending AC-54, which
    # has shown the rendered effective absorption is 1-sqrt(1-alpha) and therefore
    # moves both corners. Stated here as well as in base.yaml because this is the
    # config that claims Research-I faithfulness, and correcting only base.yaml
    # would leave the two disagreeing (AC-30 / AC-50; disclosure half RD-189).
    interior_random:
      type: interior
      corner_frac: null
      height_range: [1.2, 1.8]
      distance_range: [1.0, 10.0]
    near_corner:
      type: corner
      corner_frac: 0.2        # NOT an RI value — RI never quantifies near_corner
      height_range: [1.2, 1.8]
      distance_range: [1.0, 10.0]

  material_regimes:
    # NOT RI values — RI names the regimes but gives no absorption numbers, so
    # base.yaml's disjoint ranges stand. `asymmetric_walls` is absent: see
    # deviation 2 above.
    mixed:              { absorption: [0.05, 0.80] }
    ceiling_absorptive: { absorption: [0.85, 0.98] }

# ── Figure 6: split counts and per-split seeds ────────────────────────────────
# Count mode: every id-pool split states an exact count and its own seed, which
# frac-based hash-bucketing cannot express (fracs cannot hit 500/60/60 exactly,
# and one shared seed cannot be six). `frac: null` is explicit because the
# overlay cannot delete base.yaml's fracs (RD-32).
splits:
  train:
    { role: train, frac: null, count: 500, seed: 1001 }
  valid:
    { role: valid, frac: null, count: 60,  seed: 1002 }
  test_id:
    { role: test,  frac: null, count: 60,  seed: 1003 }
  # Deviation 2: the scalar absorption applies to all six surfaces, so this split
  # is near-anechoic (Sabine T60 median 0.151 s vs train 0.327 s) — a shift LARGER
  # in magnitude than RI's, not weaker, and different in kind. Paired improvement
  # is valid here; absolute ISO values are diagnostic only. See deviation 2 above.
  test_material_shift:
    { role: test, count: 40, seed: 1004, axes: { material: ceiling_absorptive } }
  test_placement_shift:
    { role: test, count: 30, seed: 1005, axes: { placement: near_corner } }
  # Deviation 1: RI also moves placement to near_wall+far_pair here. Held at the
  # id placement regime to keep this a single-axis shift (invariant #10).
  test_geometry_shift:
    { role: test, count: 30, seed: 1006, axes: { geometry: corridor } }
