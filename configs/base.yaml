# ── Base config: the Research-I reference instantiation ──────────────────────
# Every value the pipeline reads lives in a config layer; nothing is hardcoded in
# Python. Overlay experiment overrides with additional --config files.
#
# Parameter roles (design_spec §7): a scalar is `fixed`; a leaf may instead be
#   {tune: {space: [...], scale: log}, value: <current>}   # optimized on valid (E3)
#   {sweep: [v0, v1, ...]}                                  # research axis (E4)
# The role grammar is parsed + validated now; the search engine is stubbed (E3+).

# Experiment-ledger label (design_spec §11: D0a/D0b/E1/…): set per experiment run
# so stamped artifacts trace to the ledger row; "" for unlabeled dev runs.
run_id: ""

# ── Randomness: one master seed, independent per-aspect derivation (inv #5) ────
# Leave an aspect unset to derive it from `master`; set it to pin that aspect.
# The split_assignment seed is stable-for-life — changing it reshuffles the
# dataset (a leakage/faithfulness hazard once a run exists).
seeds:
  master: 42

# ── Simulator / representation / model selection ──────────────────────────────
# Each is a `{name, params}` plugin block: the name selects a registered plugin and
# its parameters come from configs/<kind>/<name>.yaml, so this master config stays
# plugin-agnostic. Add `params:` here only to override a specific value.
simulator:
  name: gsound_sir      # backend params come from configs/simulators/gsound_sir.yaml
representation:
  name: spectrogram     # framing params come from configs/representations/spectrogram.yaml
model:
  name: vanilla_cnn     # params come from configs/models/vanilla_cnn.yaml

# ── Audio ─────────────────────────────────────────────────────────────────────
sample_rate: 48000
# The record must be long enough for the longest decay this config's own declared
# scene support admits, or T30/EDT measure the truncation rather than the room.
# The worst corner here is the largest shoebox at the lowest absorption —
# 12 x 10 x 5 m (V = 600 m3, S = 460 m2) at alpha = 0.05 → Sabine T60 = 4.20 s —
# so 3.0 s (the Research I value) did NOT cover base's support. 4.25 s covers it
# with margin rather than by equality. Config load recomputes this corner from the
# declared ranges and records it; gen-scenes hard-gates on the REALIZED over-limit
# fraction (scenes.max_frac_below_iso_t30_decay_range), which base declares as 0.05 (see that key's note and design_spec 11.2).
#
# configs/research_i.yaml deliberately stays at 3.0 s — that is an RI-pinned value,
# not a research choice, so its 4.09 s corner is a structural deviation it discloses.
ir_duration: 4.25
ambisonics_order: 3

# ── Simulation ray budgets ────────────────────────────────────────────────────
# These are DIFFUSE ray counts: they drive gsound's `diffuse_count`, while
# `specular_count` is declared in configs/simulators/gsound_sir.yaml and held fixed
# across both legs. So "ray budget" always means the diffuse budget, never a total.
# They stay TOP-LEVEL rather than moving into the simulator block: as the
# swept research axis they must survive a simulator name change, and a plugin
# block's params do not (name-change scoping).
low_ray_budget: 5000        # low leg — swept-capable research axis (E4)
high_ray_budget: 200000     # converged reference — fixed

# ── Scene generation ──────────────────────────────────────────────────────────
# The id baseline is the controlled reference; each shift split (below) perturbs
# exactly one axis. All sampling ranges are declared here (design_spec §6.1).
scenes:
  # n_id × id-pool fracs (0.6/0.2/residual) → train/valid/test_id = 300/100/100.
  # This fraction-based sizing intentionally differs from §6.1's illustrative
  # 500/60/60 counts (which the spec marks non-durable); the discrepancy is expected.
  n_id: 500                 # id-pool size → hash-bucketed into train/valid/test_id
                            # (frac mode; count mode sets this null — see
                            #  configs/research_i.yaml)
  id_regime:
    geometry: shoebox
    placement: interior_random
    material: mixed
  # Per-axis clearance (m) keeping sources/receivers off the surfaces. Kept
  # uniform at 0.5 here: Research I's asymmetric 0.3 m ceiling margin belongs to
  # configs/research_i.yaml, and putting it here would silently re-generate every
  # existing dry-run dataset.
  margins:
    wall: 0.5
    floor: 0.5
    ceiling: 0.5
  # Rejection-sampling bound, consumed only by regimes declaring a distance_range.
  # Exceeding it raises with the geometry that made the constraint unreachable.
  max_placement_attempts: 1000
  # Largest fraction of generated scenes whose record cannot hold an admissible
  # decay. ZERO here: "the record covers the scene" is enforced rather than
  # asserted. A run that trips this has widened the geometry/absorption ranges, or
  # is using a backend whose realized record is shorter than the window.
  #
  # NOTE, and it is the point: this binds against the ACTIVE
  # BACKEND'S REALIZED SUPPORT, not against `ir_duration`. Under `dry_run` the two
  # coincide, because the scaffold fills its whole window. Under `gsound_sir` they
  # do not, and a config that passed at 4.25 s can fail here — correctly.
  # 0.05 against a MEASURED 3.83% (23/600) under the corrected support law, i.e. it
  # permits the known censoring and still trips if that roughly doubles. It is NOT
  # 0.0 any more, and the reason is a user decision of 2026-08-12 recorded at
  # design_spec 11.2: GSound-SIR's adaptive energy trim leaves the reverberant
  # corner of this population unmeasurable, and that is accepted as a documented
  # limitation of the renderer rather than something to design the population
  # around.
  #
  # The rate was 2.8% (17/600) until 2026-08-13 and the difference is not drift:
  # the law behind it predicted realized support from T60, and a crossed probe
  # measured T60's effect on the record at 0.00-0.49%. The old law
  # under-counted the very censoring this key exists to bound. Note that
  # configs/research_i.yaml now measures 5.56% against the same 0.05 and is
  # REFUSED — see design_spec 11.2; that is an open research decision, not a
  # number to be tuned until it passes.
  #
  # It is NOT hidden by this number. Those scenes still render; their T30 comes back
  # unscored WITH A REASON from the estimator's own ISO bound, and the
  # per-split scored-vs-attempted counts carry it into the report. The gate is a
  # regression tripwire on the censoring RATE; the censoring itself is disclosed.
  max_frac_below_iso_t30_decay_range: 0.05
  # Decay range a record must hold for an admissible T30 fit. ISO 3382-1 requires
  # 45 dB for T30 (35 for T20, 20 for EDT). Matches the estimator's own
  # measurement-time bound `metric_min_decay_range_db.T30` below; they answer the
  # same question at design time and measurement time, and should agree.
  iso_t30_decay_range_db: 45.0
  # Absorption above which the diffuse-field closed forms (Sabine, Eyring, critical
  # distance, DRR) become extrapolations rather than estimates. ~0.3 is the
  # usual textbook limit. Scenes above it are FLAGGED in placement_report.json and
  # summarized per split — never dropped, and no formula changes — so the E1 reader
  # can see when a reported DRR comes from a model whose premise has failed.
  diffuse_field_alpha_limit: 0.3
  geometry_families:
    # dims: per-axis (lo, hi) metre ranges. corridor's long axis is DISJOINT from
    # shoebox's so geometry_shift is a genuine held-out region.
    # `characterization` states which closed-form model applies; no default, so an
    # outdoor / partially-open family (paper §6) cannot silently inherit closed-box
    # Sabine numbers.
    shoebox:  { dims: [[3.0, 12.0], [3.0, 10.0], [2.4, 5.0]], characterization: sabine }
    corridor: { dims: [[15.0, 30.0], [1.5, 3.0], [2.4, 3.5]], characterization: sabine }
  placement_regimes:
    # `height_range` and `distance_range` are REQUIRED KEYS that may be null:
    # presence is mandatory so a constraint is never silently defaulted, and null
    # explicitly declares "no constraint". `height_range` is left unconstrained
    # here — Research I's 1.2-1.8 m is pinned in configs/research_i.yaml, the
    # config that claims RI faithfulness.
    #
    # `distance_range` is NOT left unconstrained. Both regimes
    # declare a 1.0 m MINIMUM with no maximum ([lo, null]). Three reasons, in
    # order of weight:
    #   1. Acoustics. At d = 0.3 m in a mid-sized base room (S ~ 200 m2, alpha 0.2
    #      → critical distance r_c ~ 1.0 m) the direct-to-reverberant ratio is
    #      20*log10(r_c/d) = +10.5 dB: direct-dominated, C50/D50 saturating, and
    #      the diffuse tail this study is about buried 10 dB down. That is a
    #      near-field sub-population where the denoising task is trivially easy.
    #      1.0 m sits near DRR ~ 0 dB.
    #
    #      CAVEAT ON THAT ARITHMETIC. 20*log10(r_c/d) is the textbook
    #      INVERSE-SQUARE DRR, and the pinned upstream backend does not implement
    #      inverse-square: gsSoundPropagator.cpp computes geometric spreading as
    #      1/(4*pi*(1 + d^2)), not 1/(4*pi*d^2). Direct-path energy error against
    #      the form assumed here: -3.01 dB at d = 1.0 m, -1.60 at 1.5, -0.97 at 2,
    #      -0.17 at 5, -0.04 at 10. THE FLOOR DECLARED HERE SITS EXACTLY AT THE
    #      WORST POINT. The bias is common-mode across legs but NOT across scenes or
    #      placement regimes, so it perturbs the near_corner vs interior_random
    #      comparison specifically. The floor is not moved on this account — that is
    #      a research decision, and raising it to ~3 m (where the deviation falls
    #      below 0.5 dB) would change the declared population — but the reasoning
    #      above must not be read as describing what the backend renders.
    #   2. It is inside the ISO 3382-1 5.3 minimum-distance band d_min =
    #      2*sqrt(V/(c*T)). NOTE the algebra: substituting Sabine's T reduces this
    #      to 2*sqrt(alpha*S/(c*K)), which is VOLUME-INDEPENDENT — so "the largest
    #      room" is not a corner of it at all, and the figure "~2.6 m at the
    #      largest" that stood here was not a corner but the largest shoebox at
    #      alpha = 0.2.
    #
    #      THE REAL RANGE, over every geometry x material corner the config
    #      declares — and note that `ceiling_absorptive` puts alpha in [0.85, 0.98]
    #      on the SAME shoebox family, which is what `test_material_shift` selects:
    #
    #          Sabine  d_min in [0.412, 5.712] m
    #          Eyring  d_min in [0.417, 11.413] m
    #
    #      Both extremes are the same two corners: the minimum at the smallest
    #      shoebox (3x3x2.4 m) at alpha 0.05, the maximum at the largest
    #      (12x10x5 m) at alpha 0.98. `corridor` sits inside both ends despite its
    #      length, because d_min follows SURFACE, not extent.
    #
    #      THESE ARE THE RENDERED CORNERS, not merely the configured ones.
    #      They are computed from the declared nominal alpha, and that is correct
    #      for the shipped backend because `absorption_convention: pre_compensate`
    #      passes 1-(1-alpha)^2 to `createbox`, which makes the realized absorption
    #      equal the declared one (configs/simulators/gsound_sir.yaml). Under
    #      the `as_is` convention — reachable, and what every earlier measurement
    #      was taken under — the rendered room has alpha_eff = 1-sqrt(1-alpha) and
    #      the same corner gives ~5.35 m Sabine / ~8.07 m Eyring instead. The
    #      convention decides which of the two a reader should apply, so a run's
    #      provenance records it.
    #
    #      1.0 m sits near the BOTTOM of that range, not "inside the band" as this
    #      comment previously claimed. A single global constant cannot satisfy a
    #      per-scene criterion (per-scene form is a DEFERRED ledger row — the
    #      per-regime schema cannot express it today), and the realized per-split
    #      shortfall is a DISCLOSURE owed by `placement_report.json`, which
    #      `scenes/generator.py` writes — outside this lane, recorded in the lane-M
    #      inbox. does NOT close on this edit.
    #   3. It matches Research I's minimum, so base and research_i.yaml share a
    #      separation floor and stay comparable on this axis.
    # This is a RESEARCH choice. The backend's own floor (dry_run 0.3 m;
    # gsound_sir source_radius + listener_radius = 0.2 m) is only a lower limit on
    # it, checked at gen-scenes — never the source of the number.
    # Satisfiable: the smallest base room's admissible box admits 3.16 m.
    interior_random:
      { type: interior, corner_frac: null, height_range: null, distance_range: [1.0, null] }
    near_corner:
      { type: corner, corner_frac: 0.2, height_range: null, distance_range: [1.0, null] }
  material_regimes:
    # absorption: (lo, hi). ceiling_absorptive is DISJOINT from mixed so
    # material_shift is a genuine held-out region.
    mixed:              { absorption: [0.05, 0.80] }
    ceiling_absorptive: { absorption: [0.85, 0.98] }

# ── Evaluation splits (config-declared set; design_spec §6.1, inv #9/#10) ──────
# id-pool splits share the id baseline (empty axes) and are hash-bucketed by
# `frac`; test_id is the residual (no frac). Each shift split declares a `count`
# and exactly one axis override — a controlled single-axis distribution shift.
# Add a future split (e.g. test_outdoor_shift) as one more entry — no code change.
splits:
  train:                { role: train, frac: 0.6 }
  valid:                { role: valid, frac: 0.2 }
  test_id:              { role: test }                                   # residual
  test_material_shift:  { role: test, count: 40, axes: { material: ceiling_absorptive } }
  test_placement_shift: { role: test, count: 30, axes: { placement: near_corner } }
  test_geometry_shift:  { role: test, count: 30, axes: { geometry: corridor } }

# ── Training ──────────────────────────────────────────────────────────────────
n_epochs: 100
batch_size: 8               # tuned-capable
learning_rate: 0.001        # tuned-capable
huber_delta: 1.0            # δ in dB. The trainer scales it into the z-scored loss
                            # domain by 1/high_std (training/loss.py) so the Huber knee
                            # stays O(1)-meaningful in dB (inv #7). 1 dB anchors the knee
                            # to the ISO 3382-1 C50 JND (== d0b_c50_jnd_db). Provisional
                            # op-point: §7 lists δ as tuned-on-valid — promotable to a
                            # {tune: {...}, value: 1.0} range; final δ settled at E3.
early_stopping_patience: 10 # tuned-capable

# ── Reporting ─────────────────────────────────────────────────────────────────
# Consumed by the report stage's output selector (§9). Only `text` is wired today;
# alternate formats (e.g. latex/html supplementary export) attach here — forward-
# looking seam, awaiting the §9 export build-out.
report_format: text

# ── QC thresholds ─────────────────────────────────────────────────────────────
# Render-stage quality-control gates (§6 render QC record / §7). QC decides which
# renders are ADMITTED to the dataset, and E1 is "reproduce the old null", so a
# silently different admission rule confounds the reproduction — which is why all
# FOUR of Research I's criteria are declared here rather than the two that were.
# RI states them at docs/research_I_paper.md §B.4 and Figure 5.
#
# Scored by `src/amcd/simulators/qc.py` at the render stage, on every backend and
# every scene, into `renders/qc_failures.csv`.
#
# THE ONSET CHECK IS PAIRED, NOT ABSOLUTE: the tolerance bounds the onset
# MISMATCH BETWEEN the low-ray and high-ray legs, never either leg's own onset.
# RI l.480: "a direct-path onset mismatch within the configured tolerance BETWEEN
# THE LOW-RAY AND HIGH-RAY RENDERS ... the same physical arrival represented at a
# consistent sample location across each paired example". A scene whose geometry
# puts the direct arrival at 8 ms is perfectly well paired.
onset_mismatch_tolerance_ms: 2.0

# THE ENERGY FLOOR NEEDS ITS REFERENCE, OR IT IS NOT A LEVEL. RI's figure
# gives 1e-10 as a LINEAR total energy; -60 dB stood here with no reference stated,
# which reads as -60 dB re 1.0 and is then ~40 dB STRICTER than RI's (1e-10 is
# -100 dB re 1.0). Both halves are declared so the comparison is checkable:
# `min_energy_db` is dB re `min_energy_reference`, and RI is reproduced by
# reference 1.0 with -100.0.
#
# THE FLOOR IS ON THE W CHANNEL — a DELIBERATE DEPARTURE from RI, which states
# its floor over the all-channel total. Every reported ISO-3382 metric reads W
# alone, so a total-energy floor does not bound the quantity that decides whether
# a scene is measurable. The two are not convertible by a constant either: the
# theoretical (N+1)^2 offset under N3D holds only for a plane wave or a
# mutually-incoherent field, while the MEASURED offset on real renders is +3.8 to
# +8.4 dB and moves with the ray budget on a fixed scene. `qc.py` records
# `total_energy_db` per leg as a non-gating disclosure so the RI comparison stays
# checkable.
#
# BUDGET-DEPENDENT BY CONSTRUCTION: fewer diffuse rays carry less energy, so this
# floor admits differently at different `low_ray_budget` values. At E4, where the
# budget is swept, it must either be held fixed across arms — accepting that a low
# arm may refuse to build a dataset — or declared per arm AND reported, because
# per-arm floors make the comparison one between differently-admitted scene sets.
#
# -60.0 re 1.0 is base.yaml's own choice and is deliberately stricter than RI's:
# below it an IR carries too little energy for the ISO estimator's decay range to
# be measurable at all, so admitting it would only produce unscored rows.
# `configs/research_i.yaml` overrides both to RI's values, and that deviation is
# recorded there.
min_energy_db: -60.0
min_energy_reference: 1.0

# Retained-path export bounds. RI: non-empty path data, and a file within the
# configured size bound of 128 MB (Figure 5). Both are skipped with a recorded
# reason on a backend that exports no paths, never counted as passes.
max_path_file_mb: 128.0
require_non_empty_path_file: true

# ── How much attrition a dataset may carry before it is not the dataset ───────
# A scene that fails a gating criterion is EXCLUDED, per RI §B.4 ("Examples
# failing these checks were excluded from the dataset"), not a reason to discard
# the batch. These bound how far that may go.
#
# WHY A BOUND EXISTS AT ALL: per-example exclusion has no natural floor, so a
# systematically broken backend does not fail — it quietly yields a small dataset
# that still trains, still reports, and answers a different question than the one
# asked. Excluding 700 of 720 scenes one at a time must be an error, not a result.
#
# PER SPLIT AS WELL AS OVERALL, and the per-split bound is the one that binds.
# The energy floor bites hardest where absorption is highest, which is
# `test_material_shift`'s `ceiling_absorptive` regime by construction. 5 lost
# scenes is 0.7 % of 720 and 4.2 % of a 120-scene shift split, so a global-only
# bound is close to blind to the failure that would actually distort a result:
# attrition concentrated on a shift axis is a selection effect ON that axis, and
# the per-split comparison is the primary output.
#
# 0.05 is a "something is wrong" threshold, not a statistical criterion. Attrition
# below it is still REPORTED per split — the report renders admitted/generated for
# every split whatever these values are, so a bound is never what makes attrition
# visible.
max_excluded_frac: 0.05
max_excluded_frac_per_split: 0.05

# A CRITERION THAT NEVER RAN IS NOT A CRITERION THAT PASSED. Largest share of one
# gating criterion's attempts that may come back unscored.
#
# `qc.QCRecord` is three-state precisely so a skip cannot inflate a pass count, but
# that only fixes the arithmetic — nothing was BOUNDING the skips. A criterion that
# scores nothing across the batch leaves every scene admitted, records no
# exclusion, and satisfies both attrition bounds above, because none of them is
# about coverage. RI's paired onset check is the live case: geometry overrules the
# detector on both legs and the record goes unscored, so the criterion the
# reproduction is named for can be absent from the dataset it admits.
#
# 0.10 against a backend that supplies what every criterion needs. It is NOT a
# quality bar on the renders — it is a tripwire on the INSTRUMENT, and a run that
# breaches it should be read as "this criterion is not measuring", never as
# "loosen it". `configs/overlays/simulator_dry_run.yaml` declares its own, because
# the scaffold exports no retained paths and so cannot score two of the four.
max_unscored_gating_frac: 0.10

# Tighter, and deliberately so: a refusal is a statement about the BACKEND, not
# about the scene. It also leaves nothing on disk, so a re-run retries the scene
# and — pygsound exposing no RNG seed — may admit it next time. Membership under
# refusal is therefore not reproducible the way a QC exclusion is, which is
# re-derivable from persisted artifacts. Non-zero wants a look.
max_refused_frac: 0.01

# ── D0a headroom-probe verdict thresholds (design_spec §4) ────────────────────
d0a_gap_large_db: 3.0
d0a_gap_small_db: 1.0

# ── D0b carrier-ceiling JND tolerances (design_spec §4.2) ─────────────────────
d0b_t30_jnd_frac: 0.05      # 5% of reference T30
d0b_edt_jnd_frac: 0.05      # 5% of reference EDT (ISO 3382-1 Annex A: EDT limen == T limen)
d0b_c50_jnd_db: 1.0         # 1 dB absolute

# Coverage D0b needs before it will clear a split at all. The verdict used
# to degrade to INDETERMINATE only when a split scored NOTHING, so a split that
# lost most of its scenes to unresolvable bands or failed loads could still print
# PASS on the remainder — and that remainder is a selected subset, not a sample:
# the scenes that drop are the ones whose decay the estimator could not resolve,
# which correlates with absorption, which is an axis the shift splits vary
# deliberately.
#
# 0.8 is a coverage floor, not a statistical criterion: it says "most of the split
# was measured", and anything below it means the verdict describes a different
# population than the split it is named after. It is NOT a substitute for the
# per-metric scored-vs-attempted counts, which are reported either way.
d0b_min_scored_frac: 0.8

# ── D0b absolute-level sweep ─────────────────────────────────────────
# `min_db` is an ABSOLUTE floor on encoded band energy, and `decode` rescales the
# carrier's band power to `10**(env/10)` — so wherever true power sits below the
# floor the decode BOOSTS the carrier up to it, injecting a non-decaying energy
# floor into the prediction inside the shared Schroeder window. Quiet scenes are
# the ones at risk, and how quiet is a property of the render's level convention,
# not of the model.
#
# `encode` REFUSES a scene that would breach the T30 JND (min_db_headroom_db in
# configs/representations/spectrogram.yaml), so this sweep does not gate anything.
# It DISCLOSES the margin: for each scene it shifts the encoded envelope by each
# gain below, re-clamps at `min_db`, decodes and measures the oracle's T30 error.
# A dataset whose scenes clear the guard by 2 dB and one that clears it by 40 dB
# are very different datasets, and only this says which one was rendered.
#
# Exact without a re-render: scaling a waveform by g scales band ENERGY by g^2, so
# the dB envelope shifts by exactly the gain, and the reference T30 is
# gain-invariant by construction.
#
# The ladder brackets the measured knee — at this project's own level convention
# the oracle reads +0.01 % at 0 dB, +1.27 % at -20, +126.8 % at -30 and +1029.7 %
# at -40 — so it is dense where the answer changes and stops where `encode` would
# have refused anyway.
d0b_level_sweep_db: [0.0, -10.0, -20.0, -25.0, -30.0]

# ── Ray-budget convergence tolerance ──────────────────────────
# The high leg (`high_ray_budget`) is treated as a CONVERGED REFERENCE by every
# paired-improvement metric, by D0a's headroom and by D0b's carrier test, and until
# the probe ran nothing had ever checked that. These declare what "converged"
# means, so the probe reports a verdict against a stated threshold rather than an
# eyeballed one.
#
# Set to the SAME JND tolerances the D0b carrier test uses, deliberately: a
# reference leg is converged when doubling the rays again would not move a reported
# quantity by more than the smallest difference a listener could detect. A tighter
# threshold would be measuring the raytracer's Monte-Carlo noise, not its adequacy.
#
# The probe is a TOLERANCE CHECK over a handful of scenes, NOT a CI-backed
# convergence claim, and must be reported as such.
convergence:
  t30_frac: 0.05            # matches d0b_t30_jnd_frac
  c50_db: 1.0               # matches d0b_c50_jnd_db
  band_energy_frac: 0.05    # per-band energy, relative

  # ── THE PROBE RAN, AND C50 FAILED ──────────────────────────────────
  #
  # 200,000 vs 800,000 rays over 10 scenes through the production ISO path:
  #
  #     T30   16/18 scored cells within the declared 5 %   worst 7.0 %
  #     C50   12/20 scored cells within the declared 1 dB  worst 3.24 dB
  #
  # 3.24 dB is 3.2x the ISO JND this file declares. Control for single-realization
  # variance — nominally identical 200k/210k/220k budgets, which no convergence
  # argument distinguishes and for which pygsound exposes no RNG seed — puts the
  # 200k-vs-800k delta at 3.5x to 21.2x that spread in 5 of 6 cells. The exception
  # is the most anechoic cell at 500 Hz, whose spread (2.038 dB) exceeds the
  # tolerance itself, so that cell is UNASSESSABLE rather than converged.
  #
  # So every paired C50 improvement treats as ground truth a leg that is measured
  # not to be one, and the report has to say so on the rows it affects — which is
  # what this key is for. `c50_db` is NOT loosened to make the failure go away:
  # it is the ISO JND, and moving it would change what "converged" means in order
  # to hide the result.
  #
  # TWO THINGS ARE NOT ESTABLISHED and must not be read in: that 800k WOULD
  # converge (verifying it needs 3.2M rays at ~10 h/scene, which is not
  # affordable), and that the deficit is uniform (it grows with room size and is
  # worst at 1000 Hz). Raising `high_ray_budget` is therefore a decision to spend
  # ~9 days for an unverified reference — cost is strongly superlinear, 30.5 s at
  # 200k against 1067 s at 800k, 35x for 4x the rays — not a fix.
  #
  # E1 is unaffected either way: Research I pins 200,000 (paper Figure 5), so
  # faithfulness fixes the budget regardless of what convergence would prefer.
  #
  # Declared per metric so the reference's adequacy is an explicit contract rather
  # than an assumption each metric inherits silently. `reporting/tables.py` renders
  # a caveat for every metric present here, and refuses a name that is not a
  # reported metric.
  #
  # ABSENT FROM BOTH MAPS BELOW MEANS "THE PROBE MEASURED IT AND IT CONVERGED" —
  # never "nobody looked". A quantity nobody measured goes in
  # `reference_unmeasured`, so silence is only ever a measurement.
  reference_unconverged:
    C50:
      worst_deviation: 3.24
      tolerance: 1.0          # == c50_db above; restated so the caveat renders both
      unit: dB
      n_within_tolerance: 12
      n_cells: 20
    # T30 also failed and was previously undeclared, which — under the
    # absent-means-converged rule below — asserted a convergence the measurement
    # contradicts. Milder than C50 but not clean: 2 further cells were unscored
    # (the record truncates the decay), so 18 of 20 were scored at all.
    T30:
      worst_deviation: 0.070
      tolerance: 0.05         # == t30_frac above
      unit: fraction
      n_within_tolerance: 16
      n_cells: 18

  # ── THE THIRD QUANTITY WAS NEVER MEASURED ────────────────────────────────
  # `band_energy_frac` above declares a tolerance for per-band energy, and no run
  # has ever checked anything against it: the only convergence artifact on disk
  # carries T30 and C50 verdicts and zero band-energy cells. Under a two-state
  # contract its absence would have asserted a convergence nothing tested — and it
  # is the quantity that matters most downstream, because the model's output domain
  # is per-channel log power spectrograms.
  #
  # Not measured before E1 by decision (2026-08-14, design_spec §11.3): the probe
  # costs ~3.2 h against the ~14 h render it would gate, and it cannot change what
  # E1 does — Research I pins 200,000 rays (paper Figure 5), so faithfulness fixes
  # the budget whatever convergence would prefer. Non-convergence at RI's budget is
  # itself a finding about RI, and the ray-count scoping that settles it belongs to
  # Research II.
  reference_unmeasured:
    band_energy:
      reason: >-
        the ray-budget probe has never scored per-band energy; `band_energy_frac`
        declares a tolerance nothing has been checked against, so the reference
        leg's adequacy in the model's own output domain is unknown, not established
      gate: E4 ray-count scoping (Research II)


# ── ISO 3382 evaluation bands (Hz) — design_spec §7 / §3 ──────────────────────
#
# DECLARED ONCE, HERE. The headroom guard in
# configs/representations/spectrogram.yaml is calibrated against the REPORTED metric
# bands, so it reads this set — handed to `build_representation` as a cross-cutting
# argument beside `sample_rate`. It used to hold a mirror copy
# (`min_db_headroom_octave_centres_hz`) kept in step by a test asserting equality;
# changing this line now moves the guard directly, which is what a single
# declaration means.
iso_eval_freqs: [500, 1000]

# Direct-arrival onset detection: integration starts at the first sample this many dB
# below the peak (§3 metric path). -20 dB below the peak is the ISO 3382-1:2009
# start-of-response convention, not an arbitrary gate.
metric_onset_rel_db: -20.0

# How far the energy-threshold onset detector may disagree with GEOMETRY before
# geometry adjudicates. The direct arrival's position is not an estimate:
# it is |src - rcv| / c, and the render records both. The detector still places it
# within this window, because it is the thing that knows about filter smearing and
# sub-sample timing; outside the window it has landed on a reflection and is
# overruled, with the disagreement written to the drop log.
#
# WHY IT IS NEEDED. The threshold is relative to the GLOBAL peak, so the direct
# arrival must be the loudest sample. Upstream synthesizes every path onto one noise
# carrier, so the arrival's realized amplitude is its weight times a standard-normal
# draw at its own bin, and a small draw puts it under a bar its own peak set.
# Measured over the late-field shape, 2000 trials/cell at -20 dB:
#
#     DRR      miss rate    worst error (gapless)   worst error (5 ms early gap)
#     +20 dB     0.1 %            0.021 ms                  5.000 ms
#       0 dB     0.7 %            0.104 ms                  5.042 ms
#      -5 dB     1.2 %            0.062 ms                  5.021 ms
#
# The rate is small and the consequence is not. Under the dry_run scaffold the
# diffuse tail begins AT the direct arrival, so a miss costs a tenth of a
# millisecond and nothing can see it; under a real render there is an
# early-reflection gap and a miss lands on the far side of it — the whole mixing
# time, 10 % of the C50 50 ms window, and the EDT anchor with it. This config's
# placement support admits d >= r_c, i.e. DRR <= 0 dB, which is the 0.7-1.2 % band.
#
# 1.0 ms = 48 samples at 48 kHz. Wide enough for the octave filter's own smearing
# and for the ~0.09 ms the two declared speeds of sound differ by over 10 m
# (343.0 vs gsound's 344.0), and far narrower than any mixing time a declared room
# produces — so it separates "the detector placed it" from "the detector missed it".
metric_onset_tolerance_ms: 1.0

# ── The octave-band filter the reported metrics are computed through ──────────
#
# The ORDER is an experiment parameter, not an implementation detail. It
# is not fixed by ISO 3382-1: the standard asks for IEC 61260 class 1, which this
# filter fails at any order reachable here. What the order actually buys is a
# TRADE — steeper skirts give better out-of-band rejection and a LONGER ringing
# floor, and that floor (`_band_resolvable_decay_s`) decides which bands carry the
# resolvability caveat into a reported number. 4 is shipped because the
# floors it produces (T30 20.36 / 10.16 ms, EDT 9.56 / 4.80 ms at 500 / 1000 Hz)
# sit below the decays base.yaml's declared support admits, while the rejection it
# gives is enough for one scalar absorption across all simulated bands. Both halves
# of that sentence move if the order does, which is why neither is a literal.
#
# `stopband_rejection_db` is the MEASURED consequence, declared so it cannot rot
# the way the resolvability floors did. Keyed by octaves outside the
# band; each bound is the worse of the two eval bands at that offset, rounded
# outward ~1 dB against scipy point releases, and applied on both sides. Measured
# through `_band_energy` with a pure tone at 48 kHz:
#
#     fc        -2 oct   -1 oct    +1 oct   +2 oct
#     500 Hz    -46.59   -37.43    -38.49   -47.33
#     1000 Hz   -49.59   -40.29    -41.36   -50.48
#
# Class 1 wants ~70 dB and class 2 ~60 dB in the far stopband, so at one octave out
# this meets NEITHER. Pinned by
# `test_the_octave_filter_meets_its_declared_stopband_rejection`, which reads these
# values rather than holding its own copy.
metric_octave_filter:
  order: 4
  stopband_rejection_db:
    1: -36.5
    2: -45.5

# How many times the octave filter's OWN decay a room's decay must exceed to be
# resolvable in that band. The floor is MEASURED per (metric, band) from the
# filter's impulse response and scales as 1/f; the values live in ONE place,
# `_band_resolvable_decay_s` in evaluation/room_acoustic.py. This declares
# only the safety margin.
#
# THIS IS A PROJECT-DEFINED CRITERION, NOT ISO 3382-2's. The floor is
# the FILTER'S OWN measured decay times this margin — defensible, and measured
# through the very path it governs — but a reader will take "what the band can
# resolve" for the standard's rule, and it is not. ISO 3382-2:2008 expresses the
# same concern as a bandwidth-time product, BT > 16.
#
# B IS THE REALIZED BANDWIDTH, NOT THE NOMINAL ONE. `sosfiltfilt` runs the
# section forwards and backwards, so the power response is |H|⁴ rather than |H|²
# and the equivalent noise bandwidth is NARROWER than the octave's nominal
# fc·(√2 − 1/√2). Measured by integrating |H|⁴: **317.46 Hz at 500 Hz and 634.96 Hz
# at 1000 Hz**, against nominals of 353.55 and 707.11 — 10.2 % narrower at both.
# A narrower B needs a LONGER T for the same BT, so the comparison below moves in
# the permissive direction and had understated itself:
#
#     band      B nominal   B realized   BT>16 needs T   floor at margin 2.0
#     500 Hz     353.55       317.46        50.40 ms          40.72 ms
#     1000 Hz    707.11       634.96        25.20 ms          20.32 ms
#
# So the shipped floor is **9.68 ms more permissive** than ISO 3382-2's guidance at
# 500 Hz (4.88 ms at 1000 Hz) — not the ~4.5 ms a nominal-B reading gives. Stated
# so the two criteria are not conflated; the standard's form is not adopted because
# it takes no account of this filter's realized ringing, which is what actually
# limits us. The floor's VALUE is ratified on the grounds below and does not
# move with this correction.
#
# THE MARGIN'S CALIBRATION DID NOT REPRODUCE, AND HAS BEEN RESTATED.
# superseded wording is in git history and docs/ledger_inbox/M.md.
#
# BUT THE POPULATION IS THE GOVERNING PARAMETER, AND IT IS NOT A PROPERTY OF THE
# ESTIMATOR. Holding seed, N, code path and duration rule fixed and changing
# ONLY the true-T60 grid moves the conclusion entirely:
#
#     grid 0.015-0.30 s   m1.0 +5.91  m1.5 +4.15  m2.0 +3.63  m3.0 +2.97 %
#     grid 0.015-0.10 s   m1.0 +7.96  m1.5 +6.03  m2.0 +5.53  m3.0 +5.42 %  never crosses
#     grid 0.05 -1.0  s   m1.0 +1.42  m1.5 +1.42  m2.0 +1.51  m3.0 +1.82 %  never crosses
#
# So this is "under the stated population I measure X", NOT "the documented figures
# do not reproduce" — one grid reproduces the original's qualitative shape (crossing
# above margin 3.0) and another abolishes the crossing at every margin. The original
# named no population, which is the actual defect: a calibration whose governing
# parameter is undeclared cannot be checked.
#
# THE CAUSAL ATTRIBUTION THIS COMMENT ONCE MADE IS REFUTED. It blamed the
# energy fold moving the floors. Re-running the identical
# protocol against the OLD earlier floors gives +6.23 / +4.53 / +3.82 / +3.17 %,
# i.e. the floor drift accounts for 0.32 pp of the 6.9 pp gap at margin 1.0 — about
# 5 % of it. The floor drift is real but it is NOT why these numbers differ.
# The remaining difference is unattributed, and is left unattributed rather than
# given a second guess.
#
# 2.0 IS KEPT ANYWAY, and the reason is the disclose-don't-censor rule rather
# than this calibration. Since
# the floor now DISCLOSES rather than suppresses, a margin that is too wide costs
# extra caveats and biases nothing; only a margin that is too NARROW would let an
# unresolvable band be reported without one. The calibration is therefore no longer
# load-bearing in the way it was when it governed suppression, and 2.0 sits on the
# conservative side of the crossing. This is a weaker justification than the one it
# replaces, and is written as such rather than restated with fresh numbers as
# though nothing had changed.
#
# WHAT THIS MARGIN NOW GOVERNS — a DISCLOSURE, not a suppression.
# The threshold's independence from the datum was only half the fix; the DECISION
# was still `fitted_value < floor`, which censors the estimator's own low tail and
# biases the surviving split mean upward. RE-DERIVED on the current tree (200
# realizations/point, T30 through the real path, margin 2.0, seed 20260811) — the
# error of the reported mean against truth, disclosing vs suppressing:
#
#     true T60   band   suppressed   disclose err   suppress err
#      0.020 s   500     200/200        +13.4 %      NO VALUE AT ALL
#      0.020 s  1000      96/200         +3.3 %          +14.6 %
#      0.030 s   500     192/200         +6.4 %          +38.9 %
#      0.040 s   500      79/200         +5.7 %          +14.8 %
#      0.050 s   500      12/200         +3.7 %           +5.4 %
#      0.060 s   500       0/200         +3.7 %           +3.7 %
#      0.080 s   500       0/200         +3.4 %           +3.4 %
#
# Disclosing is strictly closer to truth wherever the floor bites and IDENTICAL
# where it does not — and at true T60 = 0.02 s the 500 Hz band suppressed every
# one of 200 realizations, so suppression does not merely bias the split mean, it
# DELETES it. That corner is inside base.yaml's own declared support (Eyring admits
# T60 = 0.0179 s).
#
# So a physical leg (low/high) is never suppressed: its value is reported and
# counted in `n_bands_resolvability_limited`. Only `pred` is suppressed, and only
# in a band the PHYSICAL legs themselves resolve — a model that produced nothing
# measurable where the physics is fine has failed, but a band no leg can resolve
# is still a like-for-like paired comparison and keeps its datum.
metric_band_resolvability_margin: 2.0

# EDT below this is variance-limited, not filter-limited: measured sd 24-31 % of
# T60 here, against 6-10 % for T30. A disclosure bound, never a suppression
# threshold — eval counts how many scenes fall below it per split.
metric_edt_variance_limited_s: 0.15

# ── Stats: bootstrap CI (design_spec §9) ──────────────────────────────────────
bootstrap_n_resamples: 1000
bootstrap_alpha: 0.05
# Below this n a percentile bootstrap CI cannot reach its nominal coverage: the
# requested percentile lands inside the sample extremes, so the interval is the
# sample range and no number of resamples fixes it. At n = 3 the probability that
# a bootstrap mean equals a sample extreme is 3^-3 = 3.7 %, against the 2.5 % the
# alpha/2 tail asks for.
#
# 4 is the smallest n at which the tail is attainable, not a judgement about
# adequacy — a 4-scene CI is honest and wide. It matters because the dry-run and
# smoke configs report 3-scene splits, so the intervals in those tables were
# labelled "95 % CI" while being sample ranges.
bootstrap_min_n_for_calibrated_ci: 4
bootstrap_power: 0.8

# ISO 3382-1 SNR ADMISSIBILITY, in dB of USABLE decay, per reported metric.
# The standard requires the decay to be measurable over >= 45 dB before a T30 may
# be reported, and >= 20 dB for EDT. Nothing enforced this and nothing could: a
# Schroeder backward integral terminates at -inf dB by construction, so the
# [-5, -35] dB regression window is NEVER empty however little real decay the
# record holds, and the terminal plunge steepens the fit silently. The failure is
# SIGNED -- T30 under-reads -- so a decay that outruns its record is reported as a
# LESS reverberant room, which is the direction that hides the truncation.
#
# Measured through the shipped path, available decay -> T30 error:
#   85.0 dB -> -0.98 %   51.0 -> -0.95 %   42.5 -> -5.41 %
#   36.4 -> -13.42 %     30.7 -> -22.99 %  18.2 -> -55.88 %
# with nan_reason None and resolvability empty at every point. The JND crossing
# lands at ~43 dB, i.e. essentially exactly where the standard puts its bound.
#
# These are the STANDARD's values and they govern every real render. The dry-run
# scaffold declares its own in configs/overlays/dry_run.yaml, with the reason.
metric_min_decay_range_db:
  T30: 45.0
  EDT: 20.0
