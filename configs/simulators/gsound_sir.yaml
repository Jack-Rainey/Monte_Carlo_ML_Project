# ── GSound-SIR render backend parameters ──────────────────────────────────────
# Every backend value the render worker needs, declared here rather than in
# Python. Validated by `GsoundSirSimulator.Params` (extra="forbid"), so a typo or
# a missing key fails at config load, not mid-render under emulation.
#
# NOT here (): low_ray_budget / high_ray_budget. They are the
# swept research axis and stay TOP-LEVEL config fields — inside this block, the
# The name-change scoping in `_merge_layer` would drop them the moment a second
# raytracer were selected.

# ── Upstream version pin ──────────────────────────────────────────────────────
# yongyizang/GSound-SIR, cloned + built by scripts/setup_gsound_sir.py. The render
# step verifies the INSTALLED sha against this value and hard-errors on mismatch;
# GSound-SIR is never vendored with local modifications, so this pin is the whole
# provenance story for the simulator code (docs/gsound_sir_setup.md).
commit_sha: 608ea30f6dc4cda149c18947f9cae48bd379fa27

# ── Ray budgets ───────────────────────────────────────────────────────────────
# The swept axis — top-level `low_ray_budget` / `high_ray_budget` — maps
# to gsound's DIFFUSE ray count (`ps.Context.diffuse_count`). The specular count is
# declared here and held FIXED across both legs, so "ray budget" in every result
# means the diffuse budget and never a moving total. Both counts are stamped into
# canonical render meta so no artifact is ambiguous about which was varied.
specular_count: 2000
diffuse_depth: 100
specular_depth: 50

# ── Source / listener geometry and level ──────────────────────────────────────
source_radius: 0.1        # m, gsound source sphere
listener_radius: 0.1      # m, gsound listener sphere
source_power: 1.0         # W, held constant — absolute level is not under study

# ── Surface material ──────────────────────────────────────────────────────────
# Scene specs carry per-scene absorption (scenes.material_regimes); scattering is
# a backend-level surface property, constant across the dataset for now.
scattering: 0.5

# ── Filterbank band EDGES for SH synthesis (Hz) ───────────────────────────────
# `spherical_harmonics_rt.generate_ambisonic_ir(frequency_points=…)` wants
# n_bands-1 CROSSOVER frequencies, not band centres: they are consumed as
# `CrossoverFilter crossover(sample_rate, freq_points)` and upstream range-checks
# len == n_bands-1 (auralizer/src/cpp/binding.cpp:304,334).
#
# Derivation (traced end-to-end, not guessed): `pygsound::Context()`
# (ray_generator/src/pygsound/src/Context.cpp:8) overrides GSound's log-spaced
# defaults with octave band CENTRES {63, 125, 250, 500, 1000, 2000, 4000, 8000} Hz,
# and `gs::FrequencyBands` derives each crossover as the geometric mean of adjacent
# centres (gsFrequencyBands.cpp:83-88): sqrt(63*125)=88.7412, sqrt(125*250)=176.7767, …
#
# NOTE the first value is 88.7412, NOT 88.4. 88.4 is sqrt(62.5*125) — the
# base-two nominal 62.5 Hz centre — but pygsound uses the IEC-rounded 63 Hz, so
# 88.4 disagreed with the ray generator's own band definition by 0.384%. The two
# reported ISO bands (iso_eval_freqs 500/1000 Hz, edges 353.553 / 707.107 /
# 1414.214) coincide EXACTLY with simulated bands 3 and 4.
#
# ⚠️ Upstream `auralizer/test.py` passes the CENTRES here and is WRONG: it shifts
# every band edge ~½ octave high and misassigns the simulated per-band energies in
# the SH synthesis. Do not copy it.
frequency_points: [88.7412, 176.7767, 353.5534, 707.1068, 1414.2136, 2828.4271, 5656.8542]

# The band CENTRES the edges above sit between — pygsound's compiled-in octave set
# (Context.cpp:8). Declared rather than derived because 7 edges do not determine 8
# centres without an anchor, but NOT free: `Params.model_post_init` requires each
# edge to be the geometric mean of its adjacent centres, exactly as
# `gs::FrequencyBands` derives them, so these two lists cannot drift apart.
#
# Needed because a retained-path file must NAME the frequency of each `intensities`
# column — a path file from a second raytracer is otherwise uninterpretable
# once separated from the config that produced it.
band_centres_hz: [63.0, 125.0, 250.0, 500.0, 1000.0, 2000.0, 4000.0, 8000.0]

# ── Propagation speed (DECLARED, not configured) ──────────────────────────────
# gsound uses 344 m/s, compiled into C++ with no way to set it. Setting a
# different value here does NOT change the simulation — it makes the render FAIL,
# because every render cross-checks this against the `speeds_of_sound` the paths
# themselves report. That is deliberate: it turns a comment that could silently go
# stale into a declaration upstream can falsify.
speed_of_sound_m_s: 344.0

# ── Truncation QC threshold ───────────────────────────────────────────
# gsound's natural IR is trimmed to `ir_duration`. The discarded tail energy is
# measured per (scene, leg) and flagged above this level, relative to the native
# IR's total energy. -60 dB = one part in a million of total energy; above that the
# trim is large enough to bias T30/EDT on the most reverberant scenes, which is the
# failure this disclosure exists to make visible. Nothing ACTS on the flag yet —
# the per-criterion QC record that does is Step 4's.
max_discarded_tail_db: -60.0

# ── Render interpreter (HOST-SCOPED — not an experiment value) ────────────────
# GSound is x86-only. `null` means "run the worker under this same interpreter",
# which is correct on a native x86_64 Ubuntu/Windows/Intel-Mac host. On a host where
# the render env is a SEPARATE interpreter (Apple Silicon under Rosetta), supply its
# absolute path from a config layer — e.g.
#
#     amcd render -c configs/base.yaml -c my_host.yaml
#     # my_host.yaml:
#     #   simulator:
#     #     params:
#     #       render_python: /path/to/envs/amcd-render-x86/bin/python
#
# It is committed as null so no machine-local path enters the repository, and it is
# REDACTED from canonical render provenance (simulators/render.py): which
# interpreter ran a render is a host fact, not a property of the dataset, and
# stamping it would make the same render differ between the two hosts this project
# must support.
render_python: null

# ── Normalization ─────────────────────────────────────────────────────────────
# Must stay false. Per-IR normalization destroys low↔high energy comparability,
# and every paired-improvement metric plus the D0b carrier test rests on it. Both
# `ps.Context.normalize` and `generate_ambisonic_ir(normalize=…)` are held false;
# the Params validator rejects true with this reason.
normalize_ir: false

# ── Retained-path artifact ────────────────────────────────────────────────────
# Applies ONLY to the saved paths_*.parquet file. IR synthesis always uses the
# FULL path set — filtering before synthesis would change the IR and confound the
# very ray-budget axis under study.
#   all         → energy_percentage 100, max_rays 0
#   top_percent → energy_percentage = value
#   top_k       → max_rays = value          (Research I: top_k, k = 5000)
path_retention:
  mode: top_k
  value: 5000

# HOW THIS BACKEND REALIZES A DECLARED ABSORPTION.
#
# GSound sets reflectivity to sqrt(1-alpha) as an AMPLITUDE coefficient and
# accumulates it into a quantity it calls energy, which the synthesizer then
# takes sqrt() of. Re-derived independently from pinned upstream at
# 608ea30 (SoundMesh.cpp:221 -> gsSoundPropagator.cpp:1364,1531 ->
# binding.cpp:417,454), and confirmed by render: a 5x4x3 m room at alpha 0.30
# measured T30 0.5441 s against 0.343 s Sabine-nominal and 0.629 s at alpha_eff.
#
#   alpha_eff = 1 - sqrt(1 - alpha)      T60 realizes 1.14-1.98x nominal
#
# `pre_compensate` passes 1-(1-alpha)^2 at the createbox call site, so the room
# RENDERED is the room the scene DECLARES. That is the correct setting for any
# dataset whose acoustics are computed from nominal alpha -- which is all of
# them, since scenes/generator.py is backend-agnostic and stays in nominal alpha
# here.
#
# `as_is` renders the uncorrected room. Kept reachable, not as a fallback but
# because every measurement taken before this fix was taken under it, and those
# numbers must stay reproducible.
#
# THE CONFIRMING RENDER LEAVES A RESIDUAL, AND IT IS NOT EXPLAINED. The
# derivation above stands on the SOURCE, which is why it does not depend on that one
# render — but the render's own numbers should not be read as clean. On a room with
# a FREQUENCY-INDEPENDENT alpha, the measured T30 differs between the two evaluation
# bands: 0.5660 s at 500 Hz against 0.5222 s at 1000 Hz, an 8.4 % spread, about
# 1.7x this project's own `d0b_t30_jnd_frac`. Nothing in the declared physics
# produces a frequency dependence there.
#
# Two candidates are RULED OUT as the cause: air absorption is <= 0.4 % on a room
# this size, and the adaptive energy trim is frequency-independent (it
# closes the record on total energy, and the record is shared by both bands).
# What remains is single-realization variance — the measurement is ONE draw of the
# 5,000-ray leg, and pygsound's noise carrier is compiled at seed 42 with no way to
# request another, so the spread cannot be separated from it here.
#
# Recorded rather than resolved, because it is an UNBUDGETED T30 uncertainty: the
# convergence tolerances in configs/base.yaml are stated against the high leg, and
# this says the low leg carries a per-band spread of its own that no declared
# quantity accounts for. extrapolated-tail work will need the number.
absorption_convention: pre_compensate

# ── THE RECORD THIS BACKEND CAN ACTUALLY FILL ─────────
#
# `ir_duration` is the window the pipeline ALLOCATES. It is not what this backend
# fills, and the record-length gate has to know the difference: gating a scene
# against the buffer asks whether the decay fits an array, not whether the
# renderer will produce a record long enough to measure the decay in.
#
# TWO LIMITS, and the adaptive energy trim binds first:
#
#   1. `max_ir_length_s` below — pygsound compiles `maxIRLength = 3.0 s` and does
#      not expose it, so no render can exceed it whatever `ir_duration` says.
#   2. The trim, predicted by the law declared here.
#
# WHAT SETS THE TRIM, MEASURED. The predecessor of this law was
# `c * T60**k`, fitted on renders whose rooms were all produced by scaling one
# shoebox — so room size and decay time moved together and either could appear to
# drive the record. A crossed probe (`scripts/support_law_probe.py`, 21 renders,
# `experiments/support_law/`) separates them:
#
#   * T60 DOES NOTHING. Holding geometry fixed and moving absorption across the
#     declared `mixed` support (alpha 0.05 vs 0.80, a 16x change in T60), realized
#     support moves by 0.00 % / 0.49 % / 0.00 % at V = 21.6 / 150 / 600 m3. An
#     energy trim closes the record when it runs out of PATHS; how fast the decay
#     dies does not change how many paths there are.
#   * `diffuse_depth` IS FIRST-ORDER. Same room, depths 50 / 100 / 200 give
#     0.9022 / 1.2392 / 2.3403 s -- `depth**0.688`. The old law had no depth term,
#     so it was silently valid at exactly one value of a knob that moves the answer
#     2.6x across its plausible range. This is also what makes `diffuse_depth`
#     physically a TIME bound rather than a ray-budget knob.
#   * SURFACE AREA, NOT VOLUME. Adding volume to a depth+surface fit moves its
#     exponent to +0.067 and the residual not at all; surface alone carries +0.464.
#     More surface is more reflecting area at a given reflection order.
#
#       predicted_support_s = coefficient * diffuse_depth**a * surface_m2**b
#
# THE SHIPPED COEFFICIENT IS A CONSERVATIVE ENVELOPE, NOT THE CENTRAL FIT. A
# central fit puts half its residuals on the over-predicting side, and an
# over-predicting gate admits scenes whose record cannot hold their decay -- the
# failure this gate exists to prevent. The least-squares fit is c = 0.004906; it is
# multiplied by 0.8689, the minimum realized/predicted ratio over the fit set, so
# every one of those renders satisfies `realized >= predicted`. Margin: 13.1 %,
# mean realized/predicted 1.155.
#
# FITTED AT `low_ray_budget` (5,000), and the budget is declared because support
# rises slightly with it (measured 1.01-1.05x at 200,000). The low leg is the
# conservative end for a gate that must not over-predict.
#
# RESIDUALS, and the honest limits. Shoeboxes fit to ~3 %; the three corridor cells
# run -13 % to +13 %, so the law is weakest on the long-thin family, which is
# exactly `test_geometry_shift`. Worse, ONE corridor cell is not a deterministic
# function of geometry at all: `corr_thin_tall` (30 x 1.5 x 3.5 m) returned 1.8887 s
# at 5,000 rays and 1.2621 s at 200,000 -- support FELL 33 % for 40x the rays, while
# every other cell rose 1-5 %. Until that is understood, a corridor scene's
# admission is provisional and the envelope above is what protects it.
#
# Every render FALSIFIES this prediction against realized `native_ir_samples` and
# reports the residual (`_support_falsification`), exactly as `speed_of_sound_m_s`
# is falsified against the paths, so a prediction that over-reads surfaces as a
# defect in THIS declaration rather than governing the dataset unchallenged.
predicted_support_coefficient_s: 0.004263
predicted_support_depth_exponent: 0.6876
predicted_support_surface_exponent: 0.4638
predicted_support_fitted_at_ray_budget: 5000

# The compiled ceiling: `prop_request.maxIRLength = 3.0` (Context.cpp:33), not
# settable through `module.cpp`. With the auralizer's FILTER_TAIL_PADDING the
# native record is at most 3.043 s, so under base.yaml's `ir_duration: 4.25` the
# trim branch of `_fit_to_window` is UNREACHABLE and `max_discarded_tail_db` /
# `truncation_qc_flag` are structurally dead here. They are live under
# configs/research_i.yaml, whose `ir_duration` is 3.0 s.
max_ir_length_s: 3.0

# ── AIR ABSORPTION IS REALIZED AT alpha_ISO / 4 ───────────────────────
#
# domain confusion has a second call site, and pre-compensating alpha at
# `createbox` does not reach it. `SoundMedium::getAbsorption` already halves the ISO
# pressure dB/m to get intensity dB/m (gsSoundMedium.cpp:227), `getAttenuation` then
# converts with `dbToLinear` = 10^(dB/20) (omScalarMath.h:1935), and the synthesizer
# takes sqrt() of the result again (binding.cpp:417,454). Net realized ENERGY
# attenuation is alpha_ISO/4 dB per metre -- a factor of 4 too weak.
#
# Declared rather than corrected, because AIR_ABSORPTION is compiled ON
# (Context.cpp:17) and is not exposed for pre-compensation the way surface alpha is.
#
# INERT at the reported bands: alpha_ISO ~ 0.0024 / 0.0041 dB/m at 500 / 1000 Hz,
# <= 0.4% on T60 in a 60 m^3 room. It does NOT explain -5.6% residual.
# LIVE above them: `iso_eval_freqs` is a config list, and at 8 kHz the error reaches
# ~19% of T60 in a small room. 4mV scales with volume while S*alpha scales with
# surface, so in the largest declared room correct air absorption would DOMINATE the
# Eyring term at high frequency.
# ── SYNTHESIS: EARLY-REFLECTION HANDLING ─────────────────────────────
#
# Upstream's `generate_ambisonic_ir` takes both of these and defaults them
# (binding.cpp:284,286,498,500). The worker did not pass either, so the values
# governing how every IR's early reflections are synthesized were UPSTREAM
# DEFAULTS this project never stated — a hidden experiment value, and one that
# moves C50/D50/EDT, the metrics the early/late split is defined on.
#
# Declared at the shipped defaults, deliberately: this records what the existing
# renders were made with rather than silently changing them. Turning
# `precise_early_reflections` on separates paths into early and late by energy and
# synthesizes the early ones individually instead of onto the shared noise carrier
# (binding.cpp:357-368,429). That is plausibly MORE faithful — the carrier is what
# measures as moving C50 by ~1 dB — but it is a different renderer, needs its
# own cost measurement, and would invalidate every cached render. A change here is
# a research decision, which is why it is a config key and not a default.
precise_early_reflections: false
# Fraction of total path energy below which a path is treated as late rather than
# early. Read only when `precise_early_reflections` is true.
early_reflection_threshold: 0.01

air_absorption_realized_fraction: 0.25
# The highest band at which the alpha_ISO/4 error stays inside the tolerance below.
# `iso_eval_freqs` above this is REFUSED rather than silently mis-rendered.
air_absorption_max_eval_freq_hz: 2000.0
air_absorption_t60_error_tolerance_frac: 0.05
