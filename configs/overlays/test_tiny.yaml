# ── Tiny test config: fast, all-six-splits-populated plumbing for the suite ───
# Loaded by tests (conftest + invariants) instead of hardcoding values in Python.
# Deliberately minuscule (4 channels, 8 kHz, 0.1 s) so full-pipeline tests are
# fast; counts keep every split n>=2.
#
# SIZING ONLY, like the other overlays: `tests/conftest.py` composes
# base + overlays/simulator_dry_run.yaml + this file, so the suite runs on the
# same single backend declaration every other dry-run invocation uses (RD-51)
# rather than on a second copy that could silently drift from it.

seeds:
  master: 0

sample_rate: 8000
ir_duration: 0.1
ambisonics_order: 1        # (1+1)^2 = 4 channels

low_ray_budget: 50
high_ray_budget: 5000

representation:
  name: spectrogram
  params:                   # override the tiny STFT framing (min_db inherited from the rep file)
    n_fft: 256
    hop_length: 64

n_epochs: 1
batch_size: 2

model:
  name: vanilla_cnn
  params:
    hidden_channels: 4
    n_layers: 2

scenes:
  n_id: 20
  # A 0.1 s record against base.yaml's full geometry ranges: every scene's Sabine
  # T60 exceeds it. Declared at 1.0 (no constraint) rather than fixed, because
  # this overlay exists to exercise PLUMBING at speed and claims no acoustic
  # fidelity — the record-length rule belongs to configs that report physics
  # (AC-22). base.yaml declares 0.0 and means it.
  max_t60_over_ir_duration_frac: 1.0

splits:
  test_material_shift:  { role: test, count: 2, axes: { material: ceiling_absorptive } }
  test_placement_shift: { role: test, count: 2, axes: { placement: near_corner } }
  test_geometry_shift:  { role: test, count: 2, axes: { geometry: corridor } }
