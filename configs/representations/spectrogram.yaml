# Third-octave log-power spectrogram — default construction params.
#
# This file is the representation seam (design_spec §8): the master config selects
# a rep by name and the concrete params live here, so swapping the output domain is
# drop-in. Roadmap items this seam serves (CLAUDE.md forward-looking design):
#   - E1: the `waveform` rep swap (reproduce the old null) — its own params file.
#   - §3/D2: octave and mel band alternates register beside spectrogram.
#   - §7: band resolution (n_fft) is a tuned-capable / sweepable axis.
n_fft: 2048
hop_length: 512
# ABSOLUTE floor, in dB re 1.0 in STFT power of the float32 IR — NOT a level below
# the per-scene peak (AC-33). Stated because the IR's absolute scale is set by the
# backend (`normalize_ir: false`, `source_power: 1.0 W`, the 1/d direct term), so
# the effective dB-below-peak floor is scene-dependent: measured, encoding the same
# IR at gains 0.01 … 100 moves the clamped fraction 0.760 → 0.513. Absolute is
# deliberate — DRR and C50 are level ratios against the direct term, so a
# peak-relative floor would normalize away part of what test_placement_shift tests.
min_db: -80.0

# Smallest dB gap `encode` accepts between a scene's WEAKEST per-band peak and
# min_db (AC-37). Below it encode RAISES.
#
# Because min_db is absolute, a scene reaches it by LEVEL alone, and the damage
# lands in decode(): the clamped envelope becomes a target power the carrier is
# rescaled UP to, injecting a non-decaying floor into the prediction inside the
# Schroeder window — which is shared and set by the PHYSICAL legs (AC-17/RD-43), so
# the prediction gets no Lundeby cut of its own to truncate the injection away.
#
# 50.0 is CALIBRATED. A definitionally perfect oracle, decode(encode(high), low),
# was swept in 1 dB steps of level over six scenes spanning the declared support;
# its T30 first breaches d0b_t30_jnd_frac at 36.7-46.5 dB of headroom, while those
# same scenes carry 68.7-74.1 dB at their native level.
#
# The breach point is SCENE-DEPENDENT, so no single scalar is both tight and safe:
# admitting every still-correct scene needs <= 46.5, rejecting every breaching one
# needs > 45.5 — a 1 dB window. 50.0 errs toward REJECTING, because a false positive
# fails loudly at preprocess while a false negative is a silently wrong reported ISO
# metric. It therefore also rejects scenes at 46.5-50 dB that would still have
# measured within JND; that cost is accepted deliberately. Physically it is the
# 35 dB span T30 regresses over (-5 to -35 dB of EDR) plus 15. Full per-scene
# table: `ThirdOctaveSpectrogram.Params`.
#
# Calibrated against the SCAFFOLD's level convention, so it must be re-measured at
# the dataset-render gate, where a real render sets level from source_power and
# normalize_ir. That is why the guard raises rather than clamping harder: a stale
# value fails loudly at preprocess instead of silently biasing every reported
# ISO metric.
min_db_headroom_db: 50.0

# ── The fractional-octave ladder (AC-19) ──────────────────────────────────────
# Previously literals inside `_build_third_octave_filters`. Declared here because
# they define what a "band" IS in every reported per-band quantity.
reference_freq_hz: 1000.0    # ISO 266 / ISO 3382 anchor: f_n = 1000 * 2^(n/3)
bands_per_octave: 3          # 3 = third-octave; 1 would give the ISO octave ladder
min_center_freq_hz: 10.0     # lower bound of the ladder (the upper is derived
                             # from Nyquist, not from a fudge factor)

# Fewest FFT bins a band must contain to be KEPT.
#
# 1 preserves today's behaviour, and that is deliberate. (Behaviour-preserving AT
# 48 kHz FRAMING — the Nyquist admission rule that landed alongside it is not
# framing-independent: 8 kHz/256 gives 18 bands where the old rule gave 19, and
# 44.1 kHz/2048 gives 27 where it gave 28. See `_build_third_octave_filters`,
# F-59.) At the production framing (48 kHz, n_fft 2048 → 23.44 Hz bins) a
# third-octave band at 125 Hz is
# only ~29 Hz wide, so the five lowest bands hold ONE bin each and measure Hann
# leakage rather than band content: a 63 Hz tone peaks in the WRONG band (57.7 %
# in the 78.7 Hz band vs 35.6 % in the 49.6 Hz band). In-band fraction is 99.4 %
# at 500 Hz and above, 93.4 % at 250 Hz, 56.8 % at 125 Hz.
#
# Raising this to 3 would drop every band below ~315 Hz — real lost low-frequency
# coverage, and a research decision rather than a builder's. The measurement is
# now recorded per band in preprocessed/meta.json so the choice can be made on
# evidence. Blast radius today is bounded: reported ISO-3382 metrics are 500/1000
# Hz octave-band quantities computed from DECODED WAVEFORMS, not from these bands,
# so this affects the learned representation and low-frequency reconstruction (E2),
# not an E1 headline number. Ledger row `AC-19-value`, DEFERRED at E2
# (roadmap fix: multi-resolution sampling).
min_bins_per_band: 1
