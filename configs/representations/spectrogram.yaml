# Third-octave log-power spectrogram — default construction params.
#
# This file is the representation seam (design_spec §8): the master config selects
# a rep by name and the concrete params live here, so swapping the output domain is
# drop-in. Roadmap items this seam serves (CLAUDE.md forward-looking design):
#   - E1: the `waveform` rep swap (reproduce the old null) — its own params file.
#   - §3/D2: octave and mel band alternates register beside spectrogram.
#   - §7: band resolution (n_fft) is a tuned-capable / sweepable axis.
n_fft: 2048
hop_length: 512
# ABSOLUTE floor, in dB re 1.0 in STFT power of the float32 IR — NOT a level below
# the per-scene peak (AC-33). Stated because the IR's absolute scale is set by the
# backend (`normalize_ir: false`, `source_power: 1.0 W`, the 1/d direct term), so
# the effective dB-below-peak floor is scene-dependent: measured, encoding the same
# IR at gains 0.01 … 100 moves the clamped fraction 0.760 → 0.513. Absolute is
# deliberate — DRR and C50 are level ratios against the direct term, so a
# peak-relative floor would normalize away part of what test_placement_shift tests.
min_db: -80.0

# Smallest dB gap `encode` accepts between a scene's WEAKEST per-band peak and
# min_db (AC-37). Below it encode RAISES.
#
# Because min_db is absolute, a scene reaches it by LEVEL alone, and the damage
# lands in decode(): the clamped envelope becomes a target power the carrier is
# rescaled UP to, injecting a non-decaying floor into the prediction inside the
# Schroeder window — which is shared and set by the PHYSICAL legs (AC-17/RD-43), so
# the prediction gets no Lundeby cut of its own to truncate the injection away.
#
# RE-CALIBRATED against the operand below, which is NOT the operand the previous
# 50.0 was measured on (AC-37-R4). Population: the `valid` split ONLY, n=5, read
# from the canonical dry run's splits.json — this threshold decides which scenes
# ENTER the dataset, so it is a tuned value and is selected on validation, never on
# a test_* scene. Method: sweep level in 1 dB steps; at each level take the
# definitionally perfect oracle decode(encode(high), low) and read T30 through the
# REPORTED path (so it inherits the physical legs' shared Schroeder window and the
# defect is visible at all); record the headroom at which T30 first breaches
# d0b_t30_jnd_frac.
#
#   scene         native   last OK   breach   err at breach
#   scene_0005      81.8      51.8     50.8       6.0 %
#   scene_0006      72.0      43.0     42.0       6.7 %
#   scene_0016      75.0      48.0     47.0       5.5 %
#   scene_0017      78.2      48.2     47.2       6.1 %
#   scene_0018      77.3      49.3     48.3       6.3 %
#
# NO SINGLE SCALAR IS SIMULTANEOUSLY TIGHT AND SAFE, and by more than the previous
# comment admitted. Rejecting every breaching scene needs > 50.8; admitting every
# scene that still measures within JND needs <= 43.0. Those are CONTRADICTORY — an
# 8 dB inversion, not the "1 dB window" claimed before. The breach point is
# scene-dependent by ~9 dB in this operand (and by ~8 dB in the old all-band one:
# the same scenes breached at 31.0-39.0 dB there, so restricting the operand did
# not make the criterion sharper — it made it CORRECT, which is a different claim).
#
# 52.0 therefore errs toward REJECTING, above the worst breach at 50.8. The two
# errors are not symmetric: a false positive fails loudly at preprocess, a false
# negative is a silently wrong reported ISO metric that surfaces later looking like
# a model failure. The accepted cost is that scenes carrying 43.0-52.0 dB would
# have measured within JND and are refused anyway. That cost is ZERO in practice
# today — every valid scene carries 72.0-81.8 dB at its native level, so ~20 dB of
# margin separates the guard from normal operation.
#
# Calibrated against the SCAFFOLD's level convention, so it must be re-measured at
# the dataset-render gate, where a real render sets level from source_power and
# normalize_ir. That is why the guard raises rather than clamping harder: a stale
# value fails loudly at preprocess instead of silently biasing every reported
# ISO metric.
min_db_headroom_db: 52.0

# WHICH BANDS THE GUARD READS (AC-37-R4 / F-M3). Octave-band CENTRES, same shape as
# base.yaml's `iso_eval_freqs`; the operand is every ladder band inside the union of
# `[fc/sqrt2, fc*sqrt2]`.
#
# The guard used to minimise over ALL 27 ladder bands, so its verdict was set by
# whichever low band was quietest — measured on the calibration scene, the 99.2 Hz
# band, which is outside the reported metric span and holds too few FFT bins to be
# a band measurement at all. The threshold above, meanwhile, is calibrated on
# oracle T30, a 500/1000 Hz OCTAVE quantity of the decoded waveform. Operand and
# justification were different band sets, and the gap measured 4.91 dB on that
# scene. Worse, a minimum ACROSS FREQUENCY is a spectral-flatness test wearing a
# level test's error message: the dry-run tail is white so nothing trips it, but any
# realistic spectral slope (air absorption, frequency-dependent alpha — both
# roadmap) drops the extreme band out and encode tells the operator to fix a level
# that is fine (F-M3).
#
# CENTRES, not a [lo, hi] range: a contiguous range cannot express a non-contiguous
# evaluation band set, and would silently re-admit every band between.
#
# THIS IS A SECOND DECLARATION OF THE EVALUATION BAND SET — the AC-24 shape. It is
# only admissible because `test_the_headroom_guard_reads_exactly_the_reported_metric_bands`
# reads base.yaml and asserts EQUALITY with iso_eval_freqs (equality, not
# containment: over-coverage is the defect being fixed). It exists only because
# `build_representation` takes sample_rate as its sole cross-cutting argument, so
# the rep cannot see the master config; retiring it for a derived operand is filed
# as a spanning row in the lane-M inbox.
min_db_headroom_octave_centres_hz: [500.0, 1000.0]

# ── The fractional-octave ladder (AC-19) ──────────────────────────────────────
# Previously literals inside `_build_third_octave_filters`. Declared here because
# they define what a "band" IS in every reported per-band quantity.
reference_freq_hz: 1000.0    # ISO 266 / ISO 3382 anchor: f_n = 1000 * 2^(n/3)
bands_per_octave: 3          # 3 = third-octave; 1 would give the ISO octave ladder
min_center_freq_hz: 10.0     # lower bound of the ladder (the upper is derived
                             # from Nyquist, not from a fudge factor)

# Fewest FFT bins a band must contain to be KEPT.
#
# 1 preserves today's behaviour, and that is deliberate. (Behaviour-preserving AT
# 48 kHz FRAMING — the Nyquist admission rule that landed alongside it is not
# framing-independent: 8 kHz/256 gives 18 bands where the old rule gave 19, and
# 44.1 kHz/2048 gives 27 where it gave 28. See `_build_third_octave_filters`,
# F-59.) At the production framing (48 kHz, n_fft 2048 → 23.44 Hz bins) a
# third-octave band at 125 Hz is
# only ~29 Hz wide, so the five lowest bands hold ONE bin each and measure Hann
# leakage rather than band content: a 63 Hz tone peaks in the WRONG band (57.7 %
# in the 78.7 Hz band vs 35.6 % in the 49.6 Hz band). In-band fraction, measured at
# THIS framing (48 kHz, n_fft 2048, hop 512, min_bins_per_band 1): 0.9992 at 500 Hz
# and >= 0.9999 above, 0.9464 at 250 Hz, 0.5771 at 125 Hz (AC-19-R7 — the figures
# previously quoted here, 99.4 / 93.4 / 56.8 %, had drifted and named no framing).
#
# Raising this to 3 would drop every band below ~315 Hz — real lost low-frequency
# coverage, and a research decision rather than a builder's. The measurement is
# now recorded per band in preprocessed/meta.json so the choice can be made on
# evidence. Blast radius today is bounded: reported ISO-3382 metrics are 500/1000
# Hz octave-band quantities computed from DECODED WAVEFORMS, not from these bands,
# so this affects the learned representation and low-frequency reconstruction (E2),
# not an E1 headline number. Ledger row `AC-19-value`, DEFERRED at E2
# (roadmap fix: multi-resolution sampling).
min_bins_per_band: 1
