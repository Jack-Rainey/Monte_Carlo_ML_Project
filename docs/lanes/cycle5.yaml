# Cycle-5 partition — STAGING, not yet drawn into lanes.
#
# Written by the integrator at the close of cycle 4 so the coverage identity
# asserted by tests/test_lane_partition.py is RE-ESTABLISHED rather than suspended
# (RD-88 forbids weakening that assertion; research-director raised the sequencing
# as RD-132).
#
# WHY THERE ARE NO LANES YET. Two things must happen before cycle 5 can be
# partitioned, and neither is the builder's to decide:
#
#   1. RD-128 — RD-33a condition (i) REGRESSED in cycle 4 and its reachability is a
#      USER decision (scope by severity, or freeze against a named row set). The
#      protocol says to start a partition FROM THE GATE (planning step 1), so a
#      partition drawn before that decision would be drawn from the ledger alone —
#      exactly the RD-81 mistake cycle 4 was replanned to avoid.
#   2. The integration reviewer pass (gate step 6) has not run. It is the pass that
#      COUNTS, and it will both add rows and confirm-clean others. Partitioning
#      before it would plan against a finding set known to be stale.
#
# So every OPEN row sits in integrator_queue: serial and unassigned. That is the
# truthful reading — until lanes are drawn, the integrator owns everything — and it
# keeps the union == ledger OPEN set identity machine-checked in the meantime.
#
# Also required before lanes are drawn: RD-126, the id-allocation rule. Four lanes
# collided four ways in cycle 4 because the protocol does not assign disjoint id
# blocks. Do not open cycle-5 worktrees until docs/parallel_protocol.md says how
# ids are allocated.

