# Cycle-5 partition — STAGING, not yet drawn into lanes.
#
# Written by the integrator at the close of cycle 4 so the coverage identity in
# tests/test_lane_partition.py is RE-ESTABLISHED rather than suspended (RD-88 forbids
# weakening that assertion; research-director raised the sequencing as RD-132 and
# confirmed on review that this is a genuine re-establishment, not a dressed-up one).
#
# WHY THERE ARE NO LANES YET. Three things must happen first, none of them the
# builder's to decide:
#
#   1. RD-128 — RD-33a condition (i) REGRESSED in cycle 4 and its reachability is a
#      USER decision. The protocol says to plan a partition FROM THE GATE, so lanes
#      drawn before that decision would be drawn from the ledger alone: the RD-81
#      mistake cycle 4 was replanned to avoid.
#   2. RD-143 — the serial queue does not yet contain the cycle's own blocker.
#      AC-54 + AC-55 + AC-56 are ONE question (is the declared scene population
#      renderable by this backend at ISO-3382 fidelity?) and must be item 0.
#   3. RD-126 — the id-allocation rule. Four lanes collided four ways in cycle 4
#      because the protocol assigns no disjoint id blocks. Do NOT open cycle-5
#      worktrees until docs/parallel_protocol.md says how ids are allocated.
#
# KNOWN DEFECT OF THIS FILE, recorded rather than hidden (RD-146): the ~22 rows that
# are FIX APPLIED / awaiting re-review are pooled into the queue below and
# `awaiting_re_review` is empty. Planning step 3 depends on exactly that distinction,
# so it must be restored before lanes are drawn.

