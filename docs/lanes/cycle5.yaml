# Cycle-5 partition — drawn from the GATE, not from the ledger.
#
# Planning step 1: start from what the gate needs. RD-33a condition (ii) is
# unblocked (render() is live); condition (i) is now scoped by SEVERITY (RD-128,
# decided 2026-08-11) and needs zero OPEN blocker/major on the path list.
#
# ITEM 0 IS THE WHOLE POINT OF THIS CYCLE. AC-54 + AC-55 + AC-56 (+AC-66, AC-67,
# RD-144) are ONE question — is the declared scene population renderable by this
# backend at ISO-3382 fidelity? As configured the answer looks like NO:
#   * effective absorption is 1-sqrt(1-alpha), CONFIRMED by render AND re-derived
#     from pinned upstream source, so T60 realizes 1.14-1.98x nominal and every
#     closed form in scenes/generator.py describes a room never rendered;
#   * pygsound compiles maxIRLength = 3.0 s and does not expose it, so
#     ir_duration 4.25 can never be filled and RD-21's truncation QC is dead;
#   * diffuse_depth 100 is physically a TIME bound that kills the diffuse field
#     before the T30 window closes for ~14% of `mixed` scenes under AC-54.
# Deciding them separately invites three inconsistent partial fixes to one
# physical inconsistency (RD-143).
#
# RULE 6 (new this cycle): every lane allocates NEW row ids only from its own
# id_block below. Cycle 4 had no such rule and four lanes collided four ways —
# RD-93..RD-100 named four different findings, and one lane's new AC ids landed
# on live OPEN rows. tests/test_lane_partition.py now asserts the blocks are
# disjoint from each other and from every id the ledger already uses.
#
# Lane R is renamed B and put FIRST because it carries item 0. Lanes M/P/S keep
# cycle 4's boundaries, which held: zero textual merge conflicts across four
# lanes, and the fixed-seed ci_table.csv A/B moved exactly one row.
#
# ROW COUNT IS NOT A WORK ESTIMATE. The ledger's OPEN rows collapse into twelve
# clusters (see "FINDING CLUSTERS" in docs/review_ledger.md): ~30-40 independent
# work items. Rows in one cluster must close together or not at all.

cycle: cycle5
base_branch: v3-rebuild

# The lane exit gate was written AT this cycle's integration, in response to what
# this cycle showed: all four lanes ran their reviewers, all four fixed what those
# reviewers raised, and NOT ONE re-ran a reviewer over the fixed tree — so ~60
# fixes reached the integrator as unverified claims. Lane S never ran
# research-director at all.
#
# not_required here, and it must stay that way. These four inboxes were written
# before the gate existed, and filling in their `## LANE EXIT` blocks now would
# mean the integrator authoring reviewer evidence for passes nobody ran — the
# exact thing the gate exists to forbid (RD-253). Cycle 6 declares `required`.
exit_gate: not_required

# What this cycle does to the GATE, declared machine-readably (planning steps 1
# and 1b; asserted by tests/test_lane_partition.py). Prose said this before and
# prose is not a check — cycle 5 drew four lanes and every one of them reported,
# in its own inbox and unprompted, that it moves neither condition of RD-33a.
gate:
  lifts: []
  unblocks: []
  exception: >-
    Declared at integration, not at planning — which is the defect RD-254 exists
    to stop repeating. The four LANE rows are backlog discharge and cycle-4
    verification; RD-33a condition (i) is held by the on-path blocker/major set
    (chiefly AC-26 -> AC-38 and clusters C6/C5) and condition (ii) needs the
    RD-17 probe, which cycle 5's partition scheduled in no lane (RD-151). The
    gate-moving work — ITEM 0 / ITEM 0b — sits in serial_queue below and is the
    integrator's, so no LANE could have lifted anything. Cycle 6 must give the
    gate a lane FIRST.

