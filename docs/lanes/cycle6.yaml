# Cycle 6 — serial. The work that matters cannot be partitioned.
#
# ITEM 0 spans simulators/, scenes/, evaluation/ and configs/ at once, so no
# partition can host it (protocol rule 4). Two cycles deferred it for that reason
# and both moved the gate by zero. It is `pre_lane:` here, which is the queue that
# now exists so spanning work runs FIRST instead of last.
#
# THIS FILE IS THE RESUME STATE. `pre_lane:` and `serial_queue:` are ordered;
# whatever is still listed is what happens next. No separate resume note exists —
# docs/next_session.md was a third declaration of this and drifted from both the
# files it duplicated.

cycle: cycle6
base_branch: v3-rebuild
exit_gate: not_required   # no lanes, so no lane can report

gate:
  lifts: []
  unblocks: [RD-33a-i, RD-33a-ii]
  deliverable:
    what: >-
      RD-33a condition (ii) LIFTED — the 200,000-ray high leg validated as a
      converged reference against a config-declared tolerance, through the ISO
      path, driven via build_simulator. Every paired-improvement number in the
      project already treats that leg as ground truth and nothing has ever
      checked it.
    evidence: >-
      A 3-scene tolerance check at alpha_eff extremes, recorded as a tolerance
      check and NOT as a CI-backed convergence claim (RD-263), reporting per-band
      energy / T30 / C50 against the new config-declared convergence key. Plus
      per-scene render wall-clock, which nothing in the repo has ever recorded.
  exception: >-
    Condition (i) does not lift this cycle and is not claimed to. Under the
    2026-08-12 decision it lifts at ZERO OPEN rows on its path list, not zero
    blocker/major, and that set is larger than one session. Cycle 6 unblocks it by
    closing the C6/C5 blockers that hold its most expensive rows.

lanes: []

