# Cycle 6 — serial, no lanes. THIS FILE IS THE RESUME STATE.
#
# `groups:` is ordered; whatever is still listed is what happens next. There is no
# separate resume note — docs/next_session.md was a third declaration of this and
# drifted from both files it duplicated.
#
# The objective is ONE thing: reach a state where the 720-scene render can run.
# RD-33a lifts at zero OPEN rows on its path list (src/amcd/scenes/**,
# src/amcd/evaluation/**, config.py split handling, configs/*.yaml split
# declarations) plus a validated reference leg. That count, not a finding total,
# is how this cycle is measured.

cycle: cycle6
base_branch: v3-rebuild
exit_gate: not_required   # no lanes, so no lane can report

gate:
  lifts: [RD-33a-i]
  unblocks: [RD-33a-ii]
  deliverable:
    what: >-
      Zero OPEN rows on RD-33a condition (i)'s path list, and condition (ii)
      measured on all three quantities it names (per-band energy, T30, C50)
      rather than two.
    evidence: >-
      The on-path OPEN count printed before and after each group; a clean pass
      from all four reviewers over the tree that ships; and the retained-artifact
      render batch's falsification of the shipped support law.
  exception: >-
    Condition (ii) may not LIFT: AC-187 measures the 200k leg unconverged for C50
    (8/20 cells over the 1.0 dB ISO JND, worst 3.24 dB) and closing that by ray
    budget costs 35x per 4x rays. If it does not lift it becomes a declared
    research limitation, decided by the user, not a carried row.

lanes: []

# ── The one render batch (~20 scenes, under the 30-scene threshold, §11.1) ─────
# IRs are RETAINED to disk. Every prior probe discarded them, so each physics
# question cost another render; retention makes C5, the onset/direct-sound rows
# and the convergence rows render-free from here on.
render_batch:
  scenes: 20
  retains_irs: true
  answers: [AC-186, AC-55, AC-187, AC-64, AC-58, F-89, RD-55, AC-185, AC-182,
            AC-181, AC-180, AC-36, AC-104, RD-52, RD-23]

groups:
  - {id: 0, name: "ledger purge",        state: done,    detail: "40 bookkeeping rows deleted; header and cluster table rebuilt"}
  - {id: 1, name: "recover lane-archive substance", state: pending,
     detail: "74 rows carry no finding text; substance is in docs/ledger_inbox/archive/cycle4-{M,P,R,S}.md"}
  - {id: 2, name: "probe fixes + retained render batch", state: pending,
     detail: "per-band energy in _iso (convergence.band_energy_frac is declared and never evaluated); scene-id/seed collision; record surface_area_m2, 4V/S, diffuse_depth"}
  - {id: 3, name: "evaluation/room_acoustic.py",  state: pending}
  - {id: 4, name: "scenes/generator.py + acoustics.py + base.yaml", state: pending}
  - {id: 5, name: "simulators/ + configs/simulators/", state: pending}
  - {id: 6, name: "pipeline.py + provenance.py + config.py", state: pending}
  - {id: 7, name: "reporting/ + representations/ + stats/", state: pending}
  - {id: 8, name: "tests/ + docs/ + design_spec 11.2 re-derivation", state: pending}
  - {id: 9, name: "DEFERRED sweep",      state: pending}
  - {id: 10, name: "reviewer loop to a clean pass, then the render request", state: pending}

# Renders: the standing threshold is 30 scenes (design_spec.md 11.1). No grant, no
# allocation table, no permission clause on any ledger row.


